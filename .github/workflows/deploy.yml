# Builds the site and publishes it to GitHub Pages:
#  - on every push to main,
#  - every Monday morning, so the video section always shows the current most-viewed Shorts,
#  - on demand from the Actions tab.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the thumbnail converter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Build
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches scheduled runs off after 60 days without repository activity.
  # Re-enabling the workflow from inside each scheduled run resets that timer.
  keep-schedule-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
